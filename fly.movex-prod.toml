# fly.toml app configuration file generated for chessroulette-movex-prod on 2024-02-04T15:24:29-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "chessroulette-movex-prod"
primary_region = "mia"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]

# bez ovoga radi na default 256MB; stanje svih soba je u memoriji (MemoryMovexStore)
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[experimental]
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 3333
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  # 25/20 je bio Fly default; svaka /room stranica (puzzle, bot, review...) drzi jednu konekciju
  [services.concurrency]
    hard_limit = 2000
    soft_limit = 1500
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
